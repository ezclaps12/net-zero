<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <title>{% block title %}{% endblock %}</title>

    <style>
        body {
            background: linear-gradient(120deg, #eef2ff, #e6f7f1);
            font-family: 'Segoe UI', sans-serif;
        }

        /* NAVBAR GLASS EFFECT */
        .navbar-custom {
            backdrop-filter: blur(12px);
            background: rgba(255, 255, 255, 0.75);
            border-radius: 50px;
            transition: all 0.3s ease;
        }

        .navbar-custom:hover {
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        /* NAV LINKS */
        .nav-link {
            position: relative;
            transition: color 0.3s ease;
        }

        .nav-link::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -5px;
            width: 0%;
            height: 2px;
            background: #007bff;
            transition: 0.3s;
        }

        .nav-link:hover::after {
            width: 100%;
        }

        .nav-link:hover {
            color: #007bff !important;
        }

        /* ACTIVE LINK */
        .nav-link.active {
            font-weight: 600;
            color: #0d6efd !important;
        }

        /* LOGO */
        .navbar-brand span {
            font-size: 20px;
            letter-spacing: 0.5px;
        }

        /* PAGE CONTAINER */
        .main-container {
            padding-top: 30px;
        }

        /* SMOOTH TRANSITIONS */
        * {
            transition: all 0.2s ease-in-out;
        }
    </style>
</head>

<body>

    <div class="container mt-4">
        <nav class="navbar navbar-expand-lg navbar-custom px-4 py-2 border">
            <div class="container-fluid">

                <!-- LOGO -->
                <a class="navbar-brand d-flex align-items-center" href="/">
                    <img src="https://1000logos.net/wp-content/uploads/2020/11/Ashok-Leyland-Logo.png"
                         alt="Logo"
                         width="42"
                         height="42">
                    <span class="ms-2 fw-bold">Net Zero</span>
                </a>

                <!-- TOGGLER -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- NAV ITEMS -->
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto align-items-center">

                        <li class="nav-item px-2">
                            <a class="nav-link fs-5 {% if request.path == '/' %}active{% endif %}" href="/">
                                <i class="bi bi-house me-1"></i> Home
                            </a>
                        </li>

                        <li class="nav-item px-2">
                            <a class="nav-link fs-5 {% if 'dashboard' in request.path %}active{% endif %}" href="/dashboard">
                                <i class="bi bi-speedometer2 me-1"></i> Dashboard
                            </a>
                        </li>



                    </ul>
                </div>

            </div>
        </nav>
    </div>

    <!-- PAGE CONTENT -->
    <div class="container main-container">
        {% block content %}{% endblock %}
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
``
