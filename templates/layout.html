<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <title>{% block title %}{% endblock %}</title>

    <style>
        body {
            background-color: #f8fafc;
            color: #334155;
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
        }

        /* PREMIUM WHITE CARD */
        .glass-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.03);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* NAVBAR ENTERPRISE STYLE */
        .navbar-custom {
            background: #ffffff;
            border: 1px solid #e2e8f0 !important;
            border-radius: 12px;
            box-shadow: 0 1px 3px rgba(15, 23, 42, 0.03);
            transition: all 0.3s ease;
        }

        .navbar-custom:hover {
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
            border-color: #cbd5e1 !important;
        }



        /* LOGO */
        .navbar-brand span {
            font-size: 18px;
            letter-spacing: 0.2px;
            color: #0f172a;
        }

        /* PAGE CONTAINER */
        .main-container {
            padding-top: 25px;
            padding-bottom: 50px;
        }

        /* SMOOTH TRANSITIONS */
        * {
            transition: background-color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
        }
    </style>
</head>

<body>

    <div class="container mt-4">
        <nav class="navbar navbar-expand-lg navbar-custom px-4 py-2 border">
            <div class="container-fluid">

                <!-- LOGO -->
                <a class="navbar-brand d-flex align-items-center" href="/">
                    <img src="https://1000logos.net/wp-content/uploads/2020/11/Ashok-Leyland-Logo.png"
                         alt="Logo"
                         width="42"
                         height="42">
                    <span class="ms-2 fw-bold">Net Zero</span>
                </a>

                <!-- TOGGLER -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- NAV ITEMS -->
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto align-items-center">

                        <li class="nav-item px-2">
                            <a class="nav-link {% if request.path == '/dashboard' %}active{% endif %}" href="/dashboard">
                                <i class="bi bi-pie-chart me-1"></i> Overview
                            </a>
                        </li>

                        <li class="nav-item px-2">
                            <a class="nav-link {% if request.path == '/dashboard/ledger' %}active{% endif %}" href="/dashboard/ledger">
                                <i class="bi bi-table me-1"></i> Activity Ledger
                            </a>
                        </li>

                        <li class="nav-item px-2">
                            <a class="nav-link {% if request.path == '/dashboard/planner' %}active{% endif %}" href="/dashboard/planner">
                                <i class="bi bi-sliders me-1"></i> Decarbonization Planner
                            </a>
                        </li>

                        <!-- Scope Dropdown -->
                        <li class="nav-item dropdown px-2">
                            <a class="nav-link dropdown-toggle {% if 'scope' in request.path %}active{% endif %}" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                                <i class="bi bi-box me-1"></i> Scopes Breakdown
                            </a>
                            <ul class="dropdown-menu border-0 shadow py-2 mt-2" aria-labelledby="navbarDropdown" style="background: #ffffff; border: 1px solid #e2e8f0 !important; border-radius: 12px;">
                                <li><a class="dropdown-item py-2" href="/dashboard/scope1" style="font-size: 0.9rem;">Scope 1: Direct</a></li>
                                <li><a class="dropdown-item py-2" href="/dashboard/scope2" style="font-size: 0.9rem;">Scope 2: Purchased Energy</a></li>
                                <li><a class="dropdown-item py-2" href="/dashboard/scope3" style="font-size: 0.9rem;">Scope 3: Value Chain</a></li>
                            </ul>
                        </li>

                        <li class="nav-item px-2 ms-3">
                            <a class="btn btn-sm btn-outline-danger rounded-pill px-3 py-1 fw-bold" href="/dashboard/reset" style="font-size: 0.75rem;">
                                Reset
                              </a>
                          </li>

                    </ul>
                </div>

            </div>
        </nav>
    </div>

    <!-- PAGE CONTENT -->
    <div class="container main-container">
        {% block content %}{% endblock %}
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
``
